<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Icon Background Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.3" />

  <!-- Main Container & Medicine Icons -->
  <g transform="translate(0, -10)" filter="url(#shadow)">
    <!-- Medical Cross Emblem -->
    <rect x="226" y="90" width="60" height="150" rx="16" fill="#ffffff" />
    <rect x="181" y="135" width="150" height="60" rx="16" fill="#ffffff" />

    <!-- Pharmacy Capsule / Pill Graphic -->
    <g transform="translate(256, 310) rotate(-40)">
      <!-- Left Half (Cyan) -->
      <path d="M -90 -38 L -15 -38 C -15 -38 -15 38 -15 38 L -90 38 C -112 38 -130 20 -130 -2 C -130 -24 -112 -38 -90 -38 Z" fill="url(#pillGrad1)" />
      <!-- Right Half (Emerald Green) -->
      <path d="M -10 -38 L 65 -38 C 87 -38 105 -24 105 -2 C 105 20 87 38 65 38 L -10 38 Z" fill="url(#pillGrad2)" />
      <!-- Capsule Divider & Reflection -->
      <line x1="-12" y1="-38" x2="-12" y2="38" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
      <path d="M -80 -22 L 40 -22" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.6" />
    </g>
  </g>

  <!-- Bottom App Badge Banner -->
  <g transform="translate(256, 440)">
    <rect x="-180" y="-28" width="360" height="54" rx="27" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      STORE MEDICINE
    </text>
  </g>
</svg>
